# Contabo VPS stack: frontend + API + worker + Redis.
# Postgres is EXTERNAL — set PG_HOST to the DB server IP in .env.
# Media files: host bind dir shared by api + worker; Caddy serves /media publicly.
#
# Usage (from repo root):
#   sudo mkdir -p /var/lib/whats-auto/media && sudo chown 1001:1001 /var/lib/whats-auto/media
#   cp deploy/contabo/.env.example deploy/contabo/.env
#   # set PG_HOST=<postgres-ip>, domains, OBJECT_STORAGE_DRIVER=fs, …
#   docker compose -f deploy/contabo/docker-compose.yml --env-file deploy/contabo/.env up -d --build
#
# TLS: put Caddy/Nginx on the host (see Caddyfile). Compose only binds localhost ports.

name: whats-auto

services:
  # --------------------------------------------------------------------
  # redis — BullMQ jobs, inbox SSE pub/sub, flow buffers / answer cache
  # --------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # --------------------------------------------------------------------
  # api — AdonisJS HTTP (auth, webhooks, REST, inbox SSE, media PUT)
  # Image CMD: node bin/server.js  →  host :${API_HOST_PORT:-3333}
  # --------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-fs}
      DRIVE_DISK: ${DRIVE_DISK:-fs}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-/var/lib/whats-auto/media}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:-/var/lib/whats-auto/media}
        target: ${MEDIA_LOCAL_ROOT:-/var/lib/whats-auto/media}
    ports:
      - '${API_HOST_PORT:-3333}:3333'
    networks:
      - internal
      - edge

  # --------------------------------------------------------------------
  # worker — same backend image, BullMQ consumer (needs same media disk)
  # Override CMD: node bin/worker.js  (no public ports)
  # --------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['node', 'bin/worker.js']
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-fs}
      DRIVE_DISK: ${DRIVE_DISK:-fs}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-/var/lib/whats-auto/media}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:-/var/lib/whats-auto/media}
        target: ${MEDIA_LOCAL_ROOT:-/var/lib/whats-auto/media}
    networks:
      - internal

  # --------------------------------------------------------------------
  # frontend — Next.js standalone (UI). NEXT_PUBLIC_* baked at build time.
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to https://api.yourdomain.com}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${FRONTEND_HOST_PORT:-3000}:3000'
    networks:
      - edge

volumes:
  redis_data:

networks:
  internal:
  edge:
