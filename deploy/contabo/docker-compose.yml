# Contabo VPS stack: frontend + API + worker + Redis + Postgres (pgvector).
# TLS: existing ServeOS Caddy (`serveos-production-proxy`) owns host 80/443.
# This stack does NOT run Caddy and does NOT publish 80/443.
#
# Public HTTP: attach `frontend` + `api` to external network serveos-production_public.
# Private: postgres, redis, worker stay on `internal` only (not reachable by Caddy).
#
# ServeOS Caddyfile import + extra bind mounts: deploy/contabo/serveos-caddy.snippet
#
# Postgres: bundled `postgres` service (pgvector/pgvector:pg18). api/worker use PG_HOST=postgres.
# Schema: Lucid migrations — bash deploy/contabo/migrate.sh
#
# Usage (from repo root):
#   sudo mkdir -p /var/www/whats-auto/apps/backend/media && sudo chown 1001:1001 /var/www/whats-auto/apps/backend/media
#   cp deploy/contabo/.env.example deploy/contabo/.env
#   docker compose -f deploy/contabo/docker-compose.yml --env-file deploy/contabo/.env up -d --build
#   bash deploy/contabo/migrate.sh

name: whats-auto

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      POSTGRES_DB: ${PG_DB_NAME:-whatsapp_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # --------------------------------------------------------------------
  # api — AdonisJS HTTP (auth, webhooks, REST, inbox SSE, media PUT)
  # Listens HOST=0.0.0.0 PORT=3201. Reachable as `api` on serveos-production_public.
  # --------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3201
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-fs}
      DRIVE_DISK: ${DRIVE_DISK:-fs}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-/var/www/whats-auto/apps/backend/media}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:-/var/www/whats-auto/apps/backend/media}
        target: ${MEDIA_LOCAL_ROOT:-/var/www/whats-auto/apps/backend/media}
    expose:
      - '3201'
    networks:
      - internal
      - serveos-production_public

  # --------------------------------------------------------------------
  # worker — same backend image, BullMQ consumer (needs same media disk)
  # No HTTP. Not on the Caddy network.
  # --------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['node', 'bin/worker.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3201
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
      OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-fs}
      DRIVE_DISK: ${DRIVE_DISK:-fs}
      MEDIA_LOCAL_ROOT: ${MEDIA_LOCAL_ROOT:-/var/www/whats-auto/apps/backend/media}
    volumes:
      - type: bind
        source: ${MEDIA_HOST_PATH:-/var/www/whats-auto/apps/backend/media}
        target: ${MEDIA_LOCAL_ROOT:-/var/www/whats-auto/apps/backend/media}
    networks:
      - internal

  # --------------------------------------------------------------------
  # frontend — Next.js standalone. NEXT_PUBLIC_* baked at image build.
  # Listens HOSTNAME=0.0.0.0 PORT=3200. Reachable as `frontend` on serveos-production_public.
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to https://api.ottobot.codecolonies.com}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3200
      HOSTNAME: 0.0.0.0
    expose:
      - '3200'
    networks:
      - serveos-production_public

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
  serveos-production_public:
    external: true
