# Contabo VPS stack: frontend + API + worker + Redis.
# Postgres is EXTERNAL — set PG_HOST to the DB server IP in .env.
#
# Usage (from repo root):
#   cp deploy/contabo/.env.example deploy/contabo/.env
#   # set PG_HOST=<postgres-ip> and other secrets
#   docker compose -f deploy/contabo/docker-compose.yml --env-file deploy/contabo/.env up -d --build
# Migrations (after api is up):
#   bash deploy/contabo/migrate.sh status
#   bash deploy/contabo/migrate.sh
#   # same as: cd apps/backend && node ace migration:status && node ace migration:run
#
# TLS: put Caddy/Nginx on the host (see Caddyfile). Compose only binds localhost ports.

name: whats-auto

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD}
      POSTGRES_DB: ${PG_DB_NAME:-whatsapp_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../whatsapp_schema.sql:/schema/whatsapp_schema.sql:ro
      - ./initdb/01-load-schema.sh:/docker-entrypoint-initdb.d/01-load-schema.sh:ro
    # Schema is applied only on first start (empty volume). To reload:
    #   docker compose ... down -v   then up again (destroys DB data).
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - internal

  # --------------------------------------------------------------------
  # api — AdonisJS HTTP (auth, webhooks, REST, inbox SSE)
  # Image CMD: node bin/server.js  →  host :${API_HOST_PORT:-3333}
  # Connects to Postgres via PG_HOST IP from .env (outbound from container).
  # --------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3201
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
    ports:
      - '${API_HOST_PORT:-3201}:3201'
    networks:
      - internal
      - edge

  # --------------------------------------------------------------------
  # worker — same backend image, BullMQ consumer (outbound, campaigns, AI, flows)
  # Override CMD: node bin/worker.js  (no public ports)
  # --------------------------------------------------------------------
  worker:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    command: ['node', 'bin/worker.js']
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3201
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_URL: redis://redis:6379
      JOB_QUEUE_DRIVER: bullmq
    networks:
      - internal

  # --------------------------------------------------------------------
  # frontend — Next.js standalone (UI). NEXT_PUBLIC_* baked at build time.
  # Image CMD: node apps/frontend/server.js  →  host :${FRONTEND_HOST_PORT:-3000}
  # --------------------------------------------------------------------
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL to https://api.ottobot.codecolonies.com}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3200
      HOSTNAME: 0.0.0.0
    ports:
      - '${FRONTEND_HOST_PORT:-3200}:3200'
    networks:
      - edge

volumes:
  redis_data:

networks:
  internal:
  edge:
